<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 룰렛 - 맛있겠다</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="roulette.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">맛있겠다</a>
    <nav>
      <a href="map.html">지도</a>
      <a href="roulette.html">룰렛</a>
      <a href="review.html">리뷰</a>
    </nav>
  </header>

  <main>
    <h1>🎮 오늘 뭐 먹지? 룰렛</h1>

    <!-- 마스코트: 안경 쓴 햄스터 메뉴 박사 -->
    <div id="speech" aria-live="polite"></div>
    <svg id="mascot" class="mascot" data-mood="idle" viewBox="0 0 160 160" role="img" aria-label="마스코트 햄스터 메뉴 박사">
      <circle cx="44" cy="40" r="19" fill="#d99a5b"/>
      <circle cx="116" cy="40" r="19" fill="#d99a5b"/>
      <circle cx="44" cy="40" r="10" fill="#ffc2b8"/>
      <circle cx="116" cy="40" r="10" fill="#ffc2b8"/>
      <ellipse cx="80" cy="91" rx="62" ry="58" fill="#e8ad6d"/>
      <ellipse cx="80" cy="112" rx="45" ry="35" fill="#fff3df"/>
      <ellipse cx="42" cy="103" rx="10" ry="6" fill="#ff9f8f"/>
      <ellipse cx="118" cy="103" rx="10" ry="6" fill="#ff9f8f"/>

      <!-- 평소 표정 -->
      <g class="face face-idle">
        <circle cx="57" cy="80" r="6" fill="#3b251a"/>
        <circle cx="103" cy="80" r="6" fill="#3b251a"/>
        <circle cx="59" cy="78" r="2" fill="white"/>
        <circle cx="105" cy="78" r="2" fill="white"/>
        <path d="M70 106 Q75 112 80 106 Q85 112 90 106" fill="none" stroke="#3b251a" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- 고민하는 표정 -->
      <g class="face face-think">
        <circle cx="60" cy="76" r="5" fill="#3b251a"/>
        <circle cx="106" cy="76" r="5" fill="#3b251a"/>
        <path d="M47 58 L67 54 M93 54 L113 61" stroke="#3b251a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="80" cy="110" r="5" fill="#8a4b3c"/>
        <path d="M137 52 Q148 68 137 70 Q126 68 137 52Z" fill="#8fd3ff"/>
      </g>
      <!-- 신난 표정 -->
      <g class="face face-happy">
        <path d="M49 83 Q57 71 65 83 M95 83 Q103 71 111 83" fill="none" stroke="#3b251a" stroke-width="4" stroke-linecap="round"/>
        <path d="M66 103 Q80 130 94 103Z" fill="#8a4b3c"/>
        <ellipse cx="80" cy="113" rx="7" ry="4" fill="#ff8787"/>
      </g>

      <!-- 코, 안경, 나비넥타이, 손 -->
      <ellipse cx="80" cy="98" rx="5" ry="3.5" fill="#c96f62"/>
      <g fill="none" stroke="#5b3a8c" stroke-width="3.5">
        <circle cx="57" cy="79" r="17"/>
        <circle cx="103" cy="79" r="17"/>
        <path d="M74 76 Q80 72 86 76 M40 76 L24 70 M120 76 L136 70"/>
      </g>
      <path d="M80 137 L60 127 L60 149Z M80 137 L100 127 L100 149Z" fill="#ff7a2f"/>
      <circle cx="80" cy="137" r="6" fill="#e8590c"/>
      <circle cx="34" cy="127" r="10" fill="#e8ad6d"/>
      <circle cx="126" cy="127" r="10" fill="#e8ad6d"/>
    </svg>

    <!-- 1. 스테이지 고르기 -->
    <section id="start">
      <p>스테이지를 골라 주세요!</p>
      <div class="stages">
        <button type="button" class="stage" id="meal-btn">
          <span class="stage-icon">🍚</span>
          <strong>밥 스테이지</strong>
          <small>음식 종류 뽑기</small>
        </button>
        <button type="button" class="stage" id="cafe-btn">
          <span class="stage-icon">☕</span>
          <strong>카페 스테이지</strong>
          <small>갈 카페 뽑기</small>
        </button>
      </div>
    </section>

    <!-- 2. 룰렛 -->
    <section id="game" hidden>
      <button type="button" class="btn" id="home-btn">← 처음으로</button>
      <h2 id="stage-title"></h2>

      <div id="filter-box">
        <p>안 끌리는 종류는 눌러서 빼 주세요! (최대 2개)</p>        <div class="row" id="filters"></div>
      </div>

      <div class="wheel-box">
        <div class="pointer" id="pointer">▼</div>
        <div class="rim">
          <div id="wheel"></div>
          <div class="hub">GO!</div>
        </div>
      </div>
      <button type="button" class="btn main-btn big" id="spin">돌려!</button>
    </section>

    <!-- 3. 결과 팝업 -->
    <dialog id="popup" aria-labelledby="result-title">
      <div id="confetti" aria-hidden="true"></div>
      <button type="button" class="close" id="close-btn" aria-label="닫기">✕</button>
      <div class="badge">🎉 오늘의 PICK 획득!</div>
      <h2 id="result-title"></h2>
      <div id="pick"></div>
      <div class="row">
        <button type="button" class="btn main-btn" id="again-btn">🔄 다시 돌리기</button>
        <button type="button" class="btn" id="go-cafe">밥 먹고 카페도 갈래? ☕</button>
      </div>
      <details id="more">
        <summary id="more-title">다른 곳도 보기</summary>
        <div id="others"></div>
      </details>
      <p class="notice">방문 전에 영업시간을 확인해 주세요.</p>
    </dialog>
  </main>

  <script src="roulette.js"></script>
</body>
</html>
