<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맛집 리뷰 - 맛있겠다</title>
  <link rel="stylesheet" href="style.css">

  <style>
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .review-form, .review-item {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .review-form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    .review-form input,
    .review-form select,
    .review-form textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .review-form button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #restaurantImage {
      display: none;
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      margin-top: 15px;
      border-radius: 10px;
    }

    .review-item h3 {
      margin-bottom: 5px;
    }

    .stars {
      color: orange;
      font-size: 20px;
    }

    .review-date {
      color: gray;
      font-size: 12px;
    }

    #message {
      margin-top: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-outline {
      padding: 8px 14px;
      border: 1px solid #333;
      border-radius: 7px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    #allReviewsModal {
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      border: none;
      border-radius: 14px;
      padding: 24px;
      position: relative;
    }

    #allReviewsModal::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    #allReviewsModal .close {
      position: absolute;
      top: 16px;
      right: 16px;
      border: none;
      background: none;
      font-size: 20px;
      cursor: pointer;
    }

    .review-controls {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 16px 0;
      flex-wrap: wrap;
    }

    .review-controls label {
      margin-top: 0;
      font-weight: bold;
    }

    .review-controls select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .group-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal !important;
    }

    .restaurant-group {
      margin-top: 24px;
    }

    .restaurant-group h3 {
      border-bottom: 2px solid #333;
      padding-bottom: 6px;
    }

    /* ===== 햄스터 메뉴 박사 (roulette.html에서 가져옴) ===== */
    #speech {
      position: relative;
      width: fit-content;
      max-width: 85%;
      margin: 0 auto 14px;
      padding: 12px 20px;
      background: white;
      border: 3px solid #ff9f43;
      border-radius: 24px;
      font-weight: bold;
      text-align: center;
    }
    #speech::after {
      content: "";
      position: absolute;
      bottom: -9px;
      left: calc(50% - 8px);
      width: 12px;
      height: 12px;
      background: white;
      border-right: 3px solid #ff9f43;
      border-bottom: 3px solid #ff9f43;
      transform: rotate(45deg);
    }

    .mascot {
      display: block;
      width: 120px;
      height: 120px;
      margin: 0 auto;
      animation: bounce 1.6s ease-in-out infinite;
    }
    .mascot .face {
      display: none;
    }
    .mascot[data-mood="idle"] .face-idle,
    .mascot[data-mood="think"] .face-think,
    .mascot[data-mood="happy"] .face-happy {
      display: inline;
    }
    .mascot[data-mood="think"] {
      animation: think 0.6s ease-in-out infinite;
    }
    .mascot[data-mood="happy"] {
      animation: jump 0.5s ease-out 3;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes think {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1); }
      20% { transform: translateY(3px) scale(1.08, 0.92); }
      60% { transform: translateY(-28px) scale(0.96, 1.05); }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="logo">맛있겠다</a>
    <nav>
      <a href="map.html">지도</a>
      <a href="roulette.html">룰렛</a>
      <a href="review.html">리뷰</a>
    </nav>
  </header>

  <main>
    <h1>맛집 리뷰</h1>
    <p>방문한 음식점의 솔직한 후기를 남겨주세요!</p>

    <!-- 마스코트: 안경 쓴 햄스터 메뉴 박사 (roulette.html과 동일) -->
    <div id="speech" aria-live="polite"></div>
    <svg id="mascot" class="mascot" data-mood="idle" viewBox="0 0 160 160" role="img" aria-label="마스코트 햄스터 메뉴 박사">
      <circle cx="44" cy="40" r="19" fill="#d99a5b"/>
      <circle cx="116" cy="40" r="19" fill="#d99a5b"/>
      <circle cx="44" cy="40" r="10" fill="#ffc2b8"/>
      <circle cx="116" cy="40" r="10" fill="#ffc2b8"/>
      <ellipse cx="80" cy="91" rx="62" ry="58" fill="#e8ad6d"/>
      <ellipse cx="80" cy="112" rx="45" ry="35" fill="#fff3df"/>
      <ellipse cx="42" cy="103" rx="10" ry="6" fill="#ff9f8f"/>
      <ellipse cx="118" cy="103" rx="10" ry="6" fill="#ff9f8f"/>

      <!-- 평소 표정 -->
      <g class="face face-idle">
        <circle cx="57" cy="80" r="6" fill="#3b251a"/>
        <circle cx="103" cy="80" r="6" fill="#3b251a"/>
        <circle cx="59" cy="78" r="2" fill="white"/>
        <circle cx="105" cy="78" r="2" fill="white"/>
        <path d="M70 106 Q75 112 80 106 Q85 112 90 106" fill="none" stroke="#3b251a" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- 고민하는 표정 -->
      <g class="face face-think">
        <circle cx="60" cy="76" r="5" fill="#3b251a"/>
        <circle cx="106" cy="76" r="5" fill="#3b251a"/>
        <path d="M47 58 L67 54 M93 54 L113 61" stroke="#3b251a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="80" cy="110" r="5" fill="#8a4b3c"/>
        <path d="M137 52 Q148 68 137 70 Q126 68 137 52Z" fill="#8fd3ff"/>
      </g>
      <!-- 신난 표정 -->
      <g class="face face-happy">
        <path d="M49 83 Q57 71 65 83 M95 83 Q103 71 111 83" fill="none" stroke="#3b251a" stroke-width="4" stroke-linecap="round"/>
        <path d="M66 103 Q80 130 94 103Z" fill="#8a4b3c"/>
        <ellipse cx="80" cy="113" rx="7" ry="4" fill="#ff8787"/>
      </g>

      <!-- 코, 안경, 나비넥타이, 손 -->
      <ellipse cx="80" cy="98" rx="5" ry="3.5" fill="#c96f62"/>
      <g fill="none" stroke="#5b3a8c" stroke-width="3.5">
        <circle cx="57" cy="79" r="17"/>
        <circle cx="103" cy="79" r="17"/>
        <path d="M74 76 Q80 72 86 76 M40 76 L24 70 M120 76 L136 70"/>
      </g>
      <path d="M80 137 L60 127 L60 149Z M80 137 L100 127 L100 149Z" fill="#ff7a2f"/>
      <circle cx="80" cy="137" r="6" fill="#e8590c"/>
      <circle cx="34" cy="127" r="10" fill="#e8ad6d"/>
      <circle cx="126" cy="127" r="10" fill="#e8ad6d"/>
    </svg>

    <section class="review-form">
      <h2>리뷰 작성하기</h2>

      <form id="reviewForm">
        <label for="restaurant">음식점 선택</label>
        <select id="restaurant" required>
          <option value="">음식점을 선택해주세요</option>
        </select>

        <img id="restaurantImage" alt="선택한 음식점 사진">

        <label for="author">닉네임</label>
        <input
          id="author"
          type="text"
          placeholder="닉네임을 입력해주세요"
          maxlength="30"
          required
        >

        <label for="rating">별점</label>
        <select id="rating" required>
          <option value="">별점을 선택해주세요</option>
          <option value="5">★★★★★ (5점)</option>
          <option value="4">★★★★☆ (4점)</option>
          <option value="3">★★★☆☆ (3점)</option>
          <option value="2">★★☆☆☆ (2점)</option>
          <option value="1">★☆☆☆☆ (1점)</option>
        </select>

        <label for="content">리뷰 내용</label>
        <textarea
          id="content"
          rows="5"
          placeholder="음식과 분위기는 어땠나요?"
          maxlength="1000"
          required
        ></textarea>

        <button type="submit">리뷰 등록하기</button>
        <p id="message"></p>
      </form>
    </section>

    <section>
      <div class="section-header">
        <h2>방문자 리뷰</h2>
        <button type="button" class="btn-outline" id="openAllReviews">전체보기</button>
      </div>
      <div id="reviewList">리뷰를 불러오는 중입니다...</div>
    </section>

    <dialog id="allReviewsModal" aria-labelledby="allReviewsTitle">
      <button type="button" class="close" id="closeAllReviews" aria-label="닫기">✕</button>
      <h2 id="allReviewsTitle">방문자 리뷰 전체보기</h2>

      <div class="review-controls">
        <label for="sortSelect">정렬</label>
        <select id="sortSelect">
          <option value="latest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="rating">별점 높은순</option>
        </select>

        <label class="group-toggle">
          <input type="checkbox" id="groupByRestaurant">
          음식점별로 보기
        </label>
      </div>

      <div id="allReviewsList"></div>
    </dialog>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 여기에 Supabase 정보를 입력하세요.
    const SUPABASE_URL = "https://aamwhtmikcdzcvxhxxsr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_lBUrHe7IgNLJfC5Fm1Klwg_qDDDjV1I";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const restaurantSelect = document.getElementById("restaurant");
    const restaurantImage = document.getElementById("restaurantImage");
    const reviewList = document.getElementById("reviewList");
    const message = document.getElementById("message");

    const openAllReviewsBtn = document.getElementById("openAllReviews");
    const closeAllReviewsBtn = document.getElementById("closeAllReviews");
    const allReviewsModal = document.getElementById("allReviewsModal");
    const allReviewsList = document.getElementById("allReviewsList");
    const sortSelect = document.getElementById("sortSelect");
    const groupByRestaurantCheckbox = document.getElementById("groupByRestaurant");

    let restaurants = [];
    let allReviewsData = [];

    // 마스코트 말풍선/표정 (roulette.js의 say/setMood와 동일한 방식)
    function say(text) {
      document.getElementById("speech").textContent = text;
    }

    function setMood(mood) {
      document.getElementById("mascot").setAttribute("data-mood", mood);
    }

    say("다녀온 맛집, 솔직한 후기를 남겨주세요!");

    // 음식점 목록 불러오기
    async function loadRestaurants() {
      const { data, error } = await supabaseClient
        .from("restaurants")
        .select("*")
        .order("id");

      if (error) {
        restaurantSelect.innerHTML =
          '<option value="">음식점 목록을 불러오지 못했습니다.</option>';
        message.textContent = "음식점 불러오기 오류: " + error.message;
        return;
      }

      restaurants = data;

      data.forEach((restaurant) => {
        const option = document.createElement("option");
        option.value = restaurant.id;
        option.textContent = restaurant.name;
        restaurantSelect.appendChild(option);
      });
    }

    // 선택한 음식점 사진 표시
    restaurantSelect.addEventListener("change", () => {
      const selected = restaurants.find(
        (item) => String(item.id) === restaurantSelect.value
      );

      if (selected && selected.image) {
        restaurantImage.src = selected.image;
        restaurantImage.style.display = "block";
      } else {
        restaurantImage.style.display = "none";
      }
    });

    // 리뷰 목록 불러오기
    async function loadReviews() {
      const { data, error } = await supabaseClient
        .from("reviews")
        .select("id, author, rating, content, created_at, restaurants(name)")
        .order("created_at", { ascending: false });

      if (error) {
        reviewList.textContent =
          "리뷰를 불러오지 못했습니다: " + error.message;
        return;
      }

      allReviewsData = data;
      renderReviewList(reviewList, data);
    }

    // 리뷰 목록을 컨테이너에 렌더링
    function renderReviewList(container, reviews) {
      container.innerHTML = "";

      if (reviews.length === 0) {
        container.textContent = "아직 등록된 리뷰가 없습니다.";
        return;
      }

      reviews.forEach((review) => {
        const item = document.createElement("article");
        item.className = "review-item";

        const title = document.createElement("h3");
        title.textContent = review.restaurants?.name || "음식점";

        const stars = document.createElement("div");
        stars.className = "stars";
        stars.textContent =
          "★".repeat(review.rating) + "☆".repeat(5 - review.rating);

        const author = document.createElement("p");
        author.textContent = "작성자: " + review.author;

        const content = document.createElement("p");
        content.textContent = review.content;

        const date = document.createElement("p");
        date.className = "review-date";
        date.textContent = new Date(review.created_at).toLocaleString("ko-KR");

        item.append(title, stars, author, content, date);
        container.appendChild(item);
      });
    }

    // 정렬 기준에 맞춰 리뷰 배열을 정렬
    function getSortedReviews(reviews, sortType) {
      const sorted = [...reviews];

      if (sortType === "oldest") {
        sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      } else if (sortType === "rating") {
        sorted.sort(
          (a, b) => b.rating - a.rating || new Date(b.created_at) - new Date(a.created_at)
        );
      } else {
        sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }

      return sorted;
    }

    // 전체보기 모달 내용을 현재 정렬/그룹 설정에 맞춰 렌더링
    function renderAllReviews() {
      const sorted = getSortedReviews(allReviewsData, sortSelect.value);

      if (!groupByRestaurantCheckbox.checked) {
        renderReviewList(allReviewsList, sorted);
        return;
      }

      allReviewsList.innerHTML = "";

      if (sorted.length === 0) {
        allReviewsList.textContent = "아직 등록된 리뷰가 없습니다.";
        return;
      }

      const groups = new Map();
      sorted.forEach((review) => {
        const name = review.restaurants?.name || "음식점 미상";
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(review);
      });

      groups.forEach((reviews, name) => {
        const section = document.createElement("div");
        section.className = "restaurant-group";

        const title = document.createElement("h3");
        title.textContent = `${name} (${reviews.length})`;
        section.appendChild(title);

        const list = document.createElement("div");
        section.appendChild(list);
        renderReviewList(list, reviews);

        allReviewsList.appendChild(section);
      });
    }

    openAllReviewsBtn.addEventListener("click", () => {
      renderAllReviews();
      allReviewsModal.showModal();
    });

    closeAllReviewsBtn.addEventListener("click", () => {
      allReviewsModal.close();
    });

    sortSelect.addEventListener("change", renderAllReviews);
    groupByRestaurantCheckbox.addEventListener("change", renderAllReviews);

    // 리뷰 등록하기
    document.getElementById("reviewForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const restaurantId = restaurantSelect.value;
      const author = document.getElementById("author").value.trim();
      const rating = Number(document.getElementById("rating").value);
      const content = document.getElementById("content").value.trim();

      if (!restaurantId || !author || !rating || !content) {
        message.textContent = "모든 항목을 입력해주세요.";
        return;
      }

      const button = event.target.querySelector("button");
      button.disabled = true;
      message.textContent = "리뷰를 등록하고 있습니다...";
      setMood("think");
      say("음… 리뷰를 올리고 있어요 🥁");

      const { error } = await supabaseClient
        .from("reviews")
        .insert([{
          restaurant_id: Number(restaurantId),
          author: author,
          rating: rating,
          content: content
        }]);

      button.disabled = false;

      if (error) {
        message.textContent = "등록에 실패했습니다: " + error.message;
        setMood("idle");
        say("앗, 등록에 실패했어요. 다시 시도해주세요!");
        return;
      }

      message.textContent = "리뷰가 등록되었습니다!";
      setMood("happy");
      say("리뷰 등록 완료! 다른 분들에게 도움이 될 거예요 🎉");
      document.getElementById("content").value = "";
      document.getElementById("rating").value = "";

      await loadReviews();
    });

    // 맛집 지도에서 "리뷰 쓰기"로 들어오면 (review.html?restaurant=번호) 그 음식점을 미리 선택
    function selectRestaurantFromUrl() {
      const id = new URLSearchParams(location.search).get("restaurant");
      if (!id || !restaurants.some((item) => String(item.id) === id)) return;

      restaurantSelect.value = id;
      restaurantSelect.dispatchEvent(new Event("change"));
    }

    // 페이지 처음 열릴 때 실행
    async function initialize() {
      await loadRestaurants();
      selectRestaurantFromUrl();
      await loadReviews();
    }

    initialize();
  </script>
</body>
</html>
